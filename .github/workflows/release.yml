name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: callfit.exe
            # static C runtime: callfit.exe runs without the VC++ redistributable
            rustflags: -C target-feature=+crt-static
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: callfit
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: callfit
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --release
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "callfit-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.exe }}" -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          $hash + "  " + $name | Out-File -Encoding ascii "$name.sha256"
          # ready-to-copy Scoop manifest with this release's version, url and hash
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $m = Get-Content scoop/callfit.json -Raw | ConvertFrom-Json
          $m.version = $ver
          $m.architecture."64bit".url = "https://github.com/${{ github.repository }}/releases/download/v$ver/$name"
          $m.architecture."64bit".hash = $hash
          $m | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 callfit.json
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name="callfit-${{ matrix.target }}.tar.gz"
          tar -czf "$name" -C "target/${{ matrix.target }}/release" "${{ matrix.exe }}"
          shasum -a 256 "$name" > "$name.sha256"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            callfit-*.zip
            callfit-*.tar.gz
            callfit-*.sha256
            callfit.json
