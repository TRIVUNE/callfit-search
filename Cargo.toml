[package]
name = "callfit"
version = "0.4.0"
edition = "2021"
description = "Find funding, open calls and residencies that fit Trivune. A terminal app."
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = "2"
regex = "1"
open = "5"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
